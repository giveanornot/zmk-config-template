name: Build ZMK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-dev-env:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize West
        run: west init -l config

      - name: Update West
        run: west update

      - name: Export Zephyr
        run: west zephyr-export

      - name: Build Left
        run: west build -s zmk/app -d build/left -b nice_nano_v2 -- -DSHIELD=lily58_left

      - name: Build Right
        run: west build -s zmk/app -d build/right -b nice_nano_v2 -- -DSHIELD=lily58_right

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/left/zephyr/zmk.uf2
            build/right/zephyr/zmk.uf2
